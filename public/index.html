<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sacolão Menezes - IA</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { border: 1px solid #ddd; padding: 10px; text-align: center; border-radius: 8px; }
        .card img { width: 100px; height: 100px; object-fit: cover; }
        #chat-box { margin-top: 30px; border-top: 2px solid #2e7d32; padding-top: 20px; }
        #mensagens { height: 200px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sacolão Menezes</h1>
    <p style="text-align: center;">Confira nosso cardápio e fale com nossa IA!</p>
    
    <div id="cardapio" class="grid"></div>

    <div id="chat-box">
        <h3>Chat com IA</h3>
        <div id="mensagens"></div>
        <input type="text" id="inputChat" placeholder="Pergunte sobre receitas...">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>
</div>

<script>
    // Carregar produtos da API
    fetch('/api/produtos')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('cardapio');
            data.forEach(prod => {
                container.innerHTML += `
                    <div class="card">
                        <img src="${prod.img}" alt="${prod.nome}">
                        <p><strong>${prod.nome}</strong></p>
                        <p>R$ ${prod.preco}</p>
                    </div>
                `;
            });
        });

    function enviarMensagem() {
        // Lógica do chat aqui
        alert("Enviando para a IA...");
    }
</script>
</body>
</html>
